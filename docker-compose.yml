services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  flask-api:
    build:
      context: ./flask-api
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SESSION_COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "5000:5000"
    volumes:
      - ./ml-brain:/app/ml-brain:ro
    command:
      [
        "sh",
        "-c",
        "flask --app app:app db upgrade && exec gunicorn --bind 0.0.0.0:5000 --workers 2 --threads 4 --access-logfile - --error-logfile - app:app",
      ]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  expiry-alerts:
    build:
      context: ./flask-api
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-}
      EXPIRY_ALERT_TIMEZONE: ${EXPIRY_ALERT_TIMEZONE:-UTC}
      EXPIRY_ALERT_HOUR: ${EXPIRY_ALERT_HOUR:-7}
      EXPIRY_ALERT_MINUTE: ${EXPIRY_ALERT_MINUTE:-0}
    volumes:
      - ./ml-brain:/app/ml-brain:ro
    command: ["flask", "--app", "app:app", "run-expiry-alert-scheduler"]
    restart: unless-stopped
    depends_on:
      flask-api:
        condition: service_healthy

  freshtracker-web:
    build:
      context: ./freshtracker-web
    ports:
      - "5173:80"
    depends_on:
      flask-api:
        condition: service_healthy

volumes:
  postgres_data:
