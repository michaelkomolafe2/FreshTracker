services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: freshtracker
      POSTGRES_USER: freshtracker
      POSTGRES_PASSWORD: freshtracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshtracker -d freshtracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  flask-api:
    build:
      context: ./flask-api
    environment:
      FLASK_ENV: development
      DATABASE_URL: postgresql://freshtracker:freshtracker@db:5432/freshtracker
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
