services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: freshtracker
      POSTGRES_USER: freshtracker
      POSTGRES_PASSWORD: freshtracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshtracker -d freshtracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  flask-api:
    build:
      context: ./flask-api
    environment:
      DATABASE_URL: postgresql://freshtracker:freshtracker@db:5432/freshtracker
      SESSION_COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "5000:5000"
    volumes:
      - ./ml-brain:/app/ml-brain:ro
    command:
      [
        "sh",
        "-c",
        "flask --app app:app db upgrade && exec gunicorn --bind 0.0.0.0:5000 --workers 2 --threads 4 --access-logfile - --error-logfile - app:app",
      ]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  freshtracker-web:
    build:
      context: ./freshtracker-web
    ports:
      - "5173:80"
    depends_on:
      flask-api:
        condition: service_healthy

volumes:
  postgres_data:
